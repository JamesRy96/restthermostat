name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [hosted-api]

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Reported but non-blocking, so an IPA is still produced for testing.
      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Test
        continue-on-error: true
        run: flutter test

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry RestThermostat-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RestThermostat-unsigned-ipa
          path: RestThermostat-unsigned.ipa
